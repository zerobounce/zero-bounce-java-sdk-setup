name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        description: Tag to publish (e.g. v2.0.16)
        required: true

permissions:
  contents: read

jobs:
  validate-tag:
    outputs:
      tag_sha: ${{ steps.tag_sha.outputs.sha }}
    name: Validate tag
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag input
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          re='^v?[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.-]+)?$'
          if [[ ! "$TAG" =~ $re ]]; then
            echo "Error: the tag input must be a release tag such as v1.2.3."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ github.event.inputs.tag }}
          persist-credentials: false
      - name: Verify tag exists
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "Error: Tag is required."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Error: Tag '$TAG' does not exist."
            exit 1
          fi

      - name: Verify manifest version matches tag
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          PKG_VERSION=$(grep -m1 -E '^[[:space:]]*<revision>[0-9]' zero-bounce-sdk/pom.xml | sed -E 's/.*<revision>([^<]+)<.*/\1/')
          if [ -z "$PKG_VERSION" ]; then
            echo "Error: could not read the version from zero-bounce-sdk/pom.xml."
            exit 1
          fi
          if [ "$PKG_VERSION" != "${TAG#v}" ]; then
            echo "Error: zero-bounce-sdk/pom.xml version ($PKG_VERSION) does not match tag ($TAG)."
            exit 1
          fi
          echo "Publishing $TAG (zero-bounce-sdk/pom.xml version $PKG_VERSION)"

      - name: Record tag commit SHA
        id: tag_sha
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  publish:
    name: Test, release build and publish
    needs: [validate-tag]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    environment: release
    env:
      # CVE-2026-114938. Kept even on the patched Corretto build. Accepted on ARM.
      JAVA_TOOL_OPTIONS: -XX:-UseBASE64Intrinsics
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.inputs.tag }}
          persist-credentials: false
      - name: Set up Maven Central Repository
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: 'corretto'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.SIGNING_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: Require the CVE-2026-114938 JDK
        run: |
          text=$(java -version 2>&1)
          echo "$text"
          # The fixed Corretto builds are 21.0.13.1.2 and 25.0.5.1.2; any later build of the
          # same major is accepted, so Corretto's next update does not stop this job.
          version=$(printf '%s\n' "$text" | grep -o 'Corretto-[0-9][0-9.]*' | head -n 1 | cut -d- -f2)
          case "$version" in
            21.*) minimum=21.0.13.1.2 ;;
            *) minimum= ;;
          esac
          if [ -z "$minimum" ] || [ "$(printf '%s\n%s\n' "$minimum" "$version" | sort -V | head -n 1)" != "$minimum" ]; then
            echo "Expected Amazon Corretto 21.0.13.1.2 or a later 21 build, got '${version:-no Corretto build}'."
            exit 1
          fi

      - name: Publish to Maven Central
        run: cd zero-bounce-sdk && mvn --no-transfer-progress --batch-mode clean deploy -Prelease
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.SIGNING_PASSWORD }}

  release:
    name: Create GitHub Release
    needs: [validate-tag, publish]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.tag_sha }}
          fetch-depth: 0

          persist-credentials: false
      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
