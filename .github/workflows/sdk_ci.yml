name: SDK CI

on:
  # Started by dependabot-auto-merge.yml after it merges: a merge made with GITHUB_TOKEN
  # starts no push workflows.
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  # Check for lint issues
  lint:
    name: Test & Lint (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    env:
      # CVE-2026-114938. The flag stays on even with a patched JDK, and it is accepted on ARM.
      JAVA_TOOL_OPTIONS: -XX:-UseBASE64Intrinsics
    strategy:
      fail-fast: false
      matrix:
        # 21 is the release target (pom.xml) and the JDK publish.yml builds with; 25 is the
        # newest LTS. Corretto's current build for each major is the CVE-2026-114938 fix
        # (21.0.13.1.2 and 25.0.5.1.2). setup-java accepts only the major for Corretto.
        java: [21, 25]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Maven Central Repository
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'corretto'

      - name: Require the CVE-2026-114938 JDK
        run: |
          text=$(java -version 2>&1)
          echo "$text"
          # The fixed Corretto builds are 21.0.13.1.2 and 25.0.5.1.2; any later build of the
          # same major is accepted, so Corretto's next update does not stop this job.
          version=$(printf '%s\n' "$text" | grep -o 'Corretto-[0-9][0-9.]*' | head -n 1 | cut -d- -f2)
          case "$version" in
            21.*) minimum=21.0.13.1.2 ;;
            25.*) minimum=25.0.5.1.2 ;;
            *) minimum= ;;
          esac
          if [ -z "$minimum" ] || [ "$(printf '%s\n%s\n' "$minimum" "$version" | sort -V | head -n 1)" != "$minimum" ]; then
            echo "Expected Amazon Corretto 21.0.13.1.2 / 25.0.5.1.2 or a later build of the same major, got '${version:-no Corretto build}'."
            exit 1
          fi

      - name: Typecheck
        run: cd zero-bounce-sdk && mvn -B -DskipTests compile

      # Execute unit tests. This includes the offline fake-API suite.
      - name: Run unit tests
        run: cd zero-bounce-sdk && mvn -B test

      # Compile the project to check for errors.
      - name: Compile project
        run: cd zero-bounce-sdk && mvn -B clean install
