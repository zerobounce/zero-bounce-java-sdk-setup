name: SDK CI

on:
  # Started by dependabot-auto-merge.yml after it merges: a merge made with GITHUB_TOKEN
  # starts no push workflows.
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  # Check for lint issues
  lint:
    name: Test & Lint (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 21 is the release target (pom.xml) and the JDK publish.yml builds with; 25 is the
        # newest LTS.
        java: [21, 25]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Maven Central Repository
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Typecheck
        run: cd zero-bounce-sdk && mvn -B -DskipTests compile

      # Execute unit tests. This includes the offline fake-API suite.
      - name: Run unit tests
        run: cd zero-bounce-sdk && mvn -B test

      # Compile the project to check for errors.
      - name: Compile project
        run: cd zero-bounce-sdk && mvn -B clean install
